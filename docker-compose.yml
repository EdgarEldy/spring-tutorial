services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      JDBC_URL: jdbc:postgresql://postgres_main:5432/spring_tutorial
      JDBC_USERNAME: admin
      JDBC_PASSWORD: admin
      # WebAppInitializer already defaults to prod when spring.profiles.active is
      # unset, but CATALINA_OPTS makes the intent explicit at the deployment level
      # instead of relying on that fallback silently.
      CATALINA_OPTS: -Dspring.profiles.active=prod
    networks:
      - pg_net

networks:
  pg_net:
    external: true
